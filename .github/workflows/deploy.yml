name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Prévia da UI nova (prototype/) em /nova/, só com dados de demonstração.
      # Isolada: se falhar, o app antigo sai do mesmo jeito, sem /nova/.
      - name: Build da UI nova (prévia)
        id: proto
        continue-on-error: true
        env:
          # Nunca liga a um backend real, mesmo que o job ganhe variáveis do Supabase
          VITE_DATA_SOURCE: ""
        run: npm run proto:build

      - name: Copiar a prévia para dist/nova
        if: steps.proto.outcome == 'success'
        run: cp -r prototype/dist dist/nova

      - name: Aviso se a prévia falhou
        if: steps.proto.outcome != 'success'
        run: echo "::warning::A prévia da UI nova não foi gerada; o app antigo segue publicado sem /nova/."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
